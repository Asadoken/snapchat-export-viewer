<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapchat Export Viewer</title>
<meta name="description" content="Browse your Snapchat data export like the app: chats with photos and videos, memories, a map, stories and a recap. Runs entirely in your browser.">
<style>
:root {
  --bg: #ffffff; --panel: #f6f6f7; --panel2: #ececee; --hover: #eeeef0; --text: #16161a;
  --muted: #6f6f76; --line: #e3e3e6; --accent: #fffc00; --accent-ink: #000;
  --me: #f23c57; --them: #0eadff; --video: #a05dcd; --chip: #f0f0f2;
  --c-me: #e0304c; --c-them: #0a8fd6; --grid: #e6e6e9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --panel: #1b1b1d; --panel2: #262629; --hover: #242427; --text: #f4f4f5;
    --muted: #8e8e95; --line: #2c2c30; --chip: #232326; --c-me: #f23c57; --c-them: #1b96dc; --grid: #2a2a2e;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --panel: #1b1b1d; --panel2: #262629; --hover: #242427; --text: #f4f4f5;
  --muted: #8e8e95; --line: #2c2c30; --chip: #232326; --c-me: #f23c57; --c-them: #1b96dc; --grid: #2a2a2e;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font: 15px/1.4 "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
svg { display: block; }
h2 { font-size: 17px; margin: 30px 0 10px; }
.app { display: flex; height: 100vh; height: 100dvh; }
.body { flex: 1; display: flex; min-width: 0; min-height: 0; }

/* rail */
.rail { width: 72px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; margin-bottom: 12px; }
.rail button { width: 48px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--muted); position: relative; }
.rail button:hover { background: var(--hover); color: var(--text); }
.rail button.on { color: var(--text); background: var(--panel2); }
.rail button .tip { position: absolute; left: 58px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600;
  padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 1000; }
.rail button:hover .tip { opacity: 1; }
.rail .spacer { flex: 1; }

/* chat list */
.list { width: 360px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
.list-head { padding: 18px 16px 10px; }
.list-head h1 { font-size: 22px; margin: 0 0 12px; font-weight: 700; letter-spacing: -.01em; }
.search { display: flex; align-items: center; gap: 8px; background: var(--chip); border-radius: 999px; padding: 8px 14px; color: var(--muted); }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; }
.search input::placeholder { color: var(--muted); }
.convs { overflow-y: auto; flex: 1; padding: 4px 8px 16px; }
.conv { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 12px; cursor: pointer; width: 100%; text-align: left; }
.conv:hover { background: var(--hover); }
.conv.on { background: var(--panel2); }
.conv .meta { min-width: 0; flex: 1; }
.conv .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.status .preview { overflow: hidden; text-overflow: ellipsis; }
.avatar { flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; text-transform: uppercase; }
.sq { width: 11px; height: 11px; border-radius: 2px; flex: none; }
.sq.hollow { background: none !important; border: 2px solid; }

/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.empty { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
.empty .ghost { width: 72px; height: 72px; border-radius: 22px; background: var(--accent); display: grid; place-items: center; margin: 0 auto 16px; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); min-height: 64px; }
.chat-head .who-btn { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-align: left; border-radius: 12px; padding: 4px 8px 4px 4px; margin-left: -4px; }
.chat-head .who-btn:hover { background: var(--hover); }
.chat-head .title { flex: 1; min-width: 0; }
.chat-head .title b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head .title span { font-size: 13px; color: var(--muted); }
.chat-head .search { width: 240px; padding: 6px 12px; }
.back { display: none; width: 36px; height: 36px; border-radius: 50%; place-items: center; flex: none; }
.back:hover { background: var(--hover); }
.msgs { flex: 1; overflow-y: auto; padding: 8px 24px 24px; }
.msgs-inner { max-width: 760px; margin: 0 auto; }
.day { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.grp { margin-top: 12px; }
.who { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
.line { position: relative; border-left: 2px solid; padding: 3px 64px 3px 10px; white-space: pre-wrap; word-wrap: break-word; }
.line:hover { background: var(--hover); }
.line time { position: absolute; right: 8px; top: 4px; font-size: 11px; color: var(--muted); opacity: 0; }
.line:hover time { opacity: 1; }
.line a { color: var(--them); }
.line mark { background: var(--accent); color: var(--accent-ink); border-radius: 3px; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.pill.italic { font-style: italic; font-weight: 400; }
.media-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0; }
.thumb { position: relative; width: 180px; height: 240px; border-radius: 10px; overflow: hidden; background: var(--panel2); cursor: zoom-in; flex: none; }
.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ov { pointer-events: none; }
.play { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.play span { width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.cap { margin-top: 4px; }
audio { height: 36px; max-width: 280px; }
.more { display: block; margin: 12px auto; padding: 8px 16px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 600; }
.more:hover { background: var(--panel2); }

/* pages */
.page { flex: 1; overflow-y: auto; padding: 24px 32px 56px; }
.page-inner { max-width: 1100px; margin: 0 auto; }
.page h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 18px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
.chips button, .chip { padding: 7px 14px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 600; }
.chips button.on { background: var(--text); color: var(--bg); }
.chip { display: inline-block; font-weight: 500; font-size: 13px; padding: 6px 12px; }
.chips select { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: var(--chip); color: var(--text); border: 0; }
.month { font-size: 17px; font-weight: 700; margin: 26px 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.tile { position: relative; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; background: var(--panel2); cursor: zoom-in; }
.tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .ov { pointer-events: none; }
.tile .badge { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.otd { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
.otd .tile { width: 120px; flex: none; }
.rows { background: var(--panel); border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
button.row { width: 100%; text-align: left; }
button.row:hover { background: var(--hover); }
.row .meta { flex: 1; min-width: 0; }
.row .meta > div:first-child { font-weight: 600; }
.row .muted, .muted { color: var(--muted); font-size: 13px; }
.row .act { padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 600; }
.row .act:hover { background: var(--panel2); }
.row .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; flex: none; font-size: 17px; }
.card { background: var(--panel); border-radius: 20px; padding: 28px; display: flex; gap: 24px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.score { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #000; font-weight: 700; border-radius: 999px; padding: 4px 12px; font-size: 14px; margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--panel); border-radius: 16px; padding: 16px; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.two > div > h2:first-child { margin-top: 30px; }
details.raw { background: var(--panel); border-radius: 14px; margin-bottom: 8px; }
details.raw summary { padding: 14px 18px; font-weight: 700; cursor: pointer; }
.kv { display: grid; grid-template-columns: minmax(140px, 260px) 1fr; gap: 6px 16px; padding: 0 18px 16px; font-size: 14px; overflow-x: auto; }
.kv > div:nth-child(odd) { color: var(--muted); }
.kv > div { word-break: break-word; }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
.tbl { overflow-x: auto; padding: 0 18px 16px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }

/* charts */
.chart-card { background: var(--panel); border-radius: 18px; padding: 18px 18px 12px; }
.chart-card h3 { margin: 0; font-size: 15px; }
.chart-card .desc { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chart { position: relative; }
.chart svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .hit { fill: transparent; cursor: default; outline: none; }
.chart .hit:hover, .chart .hit:focus { fill: var(--text); fill-opacity: .05; }
.dt summary { font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 6px; }
.dt table { margin-top: 6px; }
.dt td, .dt th { padding: 3px 12px 3px 0; font-variant-numeric: tabular-nums; }
.heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 2px; font-size: 11px; color: var(--muted); }
.heat div { height: 20px; border-radius: 3px; }
.heat .lab { background: none; display: flex; align-items: center; }
.heat .hx { background: none; height: auto; text-align: center; }
.heat .cell:hover { outline: 2px solid var(--text); outline-offset: -1px; }
.hbars { display: grid; grid-template-columns: minmax(80px, 180px) 1fr auto; gap: 8px 12px; align-items: center; font-size: 14px; }
.hbars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbars .lbl button { text-align: left; font-weight: 600; }
.hbars .lbl button:hover { text-decoration: underline; }
.hbars .track { height: 12px; }
.hbars .fill { height: 100%; background: var(--c-them); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbars .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.emoji-grid div { background: var(--panel); border-radius: 14px; padding: 10px 6px; text-align: center; }
.emoji-grid b { display: block; font-size: 28px; line-height: 1.2; font-weight: 400; }
#tip { position: fixed; z-index: 2000; pointer-events: none; background: var(--text); color: var(--bg); border-radius: 10px; padding: 8px 10px;
  font-size: 12px; min-width: 110px; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
#tip .t { font-weight: 700; margin-bottom: 4px; opacity: .75; }
#tip .r { display: flex; align-items: center; gap: 8px; }
#tip .r i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
#tip .r b { font-size: 13px; font-variant-numeric: tabular-nums; }

/* stories */
.rings { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 12px; }
.ring { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; flex: none; font-size: 12px; text-align: center; }
.ring .rg { padding: 3px; border-radius: 50%; background: conic-gradient(from 200deg, #a05dcd, #0eadff, #a05dcd); }
.ring .rg > div { border: 3px solid var(--bg); }
.ring .nm { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

/* map */
.mapwrap { flex: 1; display: flex; min-width: 0; }
.mappanel { width: 360px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); padding: 18px 16px 32px; }
.mappanel h1 { font-size: 22px; margin: 0 0 4px; }
.mappanel h2 { font-size: 15px; margin: 22px 0 8px; }
#map { flex: 1; min-width: 0; background: var(--panel2); }
.mc { background: var(--accent); color: #000; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px;
  box-shadow: 0 0 0 3px rgba(255,252,0,.35), 0 2px 6px rgba(0,0,0,.35); border: 2px solid #fff; width: 100%; height: 100%; }
.md { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.pin { background: #fff; color: #000; font-weight: 700; font-size: 12px; border-radius: 999px; padding: 4px 10px 4px 6px; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.35); display: inline-flex; gap: 4px; align-items: center; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel) !important; color: var(--text) !important; }
.leaflet-popup-content { margin: 12px 14px !important; font: 14px/1.4 "Avenir Next", Avenir, -apple-system, sans-serif; }
.leaflet-popup-content button { margin-top: 8px; background: var(--accent); color: #000; font-weight: 700; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.map-note { padding: 40px; color: var(--muted); text-align: center; }

/* sheets */
.lb, .sheet-bg { position: fixed; inset: 0; display: none; z-index: 1500; }
.lb { background: rgba(0,0,0,.92); }
.lb.open { display: flex; align-items: center; justify-content: center; }
.lb .stage { position: relative; height: calc(100% - 96px); aspect-ratio: 9 / 16; max-width: calc(100% - 140px); }
.lb .stage img, .lb .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.lb .stage .ov { pointer-events: none; }
.lb .x, .lb .nav, .sheet .x { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; }
.lb .x:hover, .lb .nav:hover { background: rgba(255,255,255,.24); }
.lb .x { top: 16px; right: 16px; }
.lb .prev { left: 20px; top: 50%; margin-top: -22px; }
.lb .next { right: 20px; top: 50%; margin-top: -22px; }
.lb .info { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: #ddd; font-size: 14px; }
.lb a { color: #fff; }
.sheet-bg { background: rgba(0,0,0,.5); }
.sheet-bg.open { display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet { position: relative; background: var(--bg); border-radius: 24px; width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; padding: 28px 24px 24px; }
.sheet .x { top: 14px; right: 14px; width: 36px; height: 36px; background: var(--chip); color: var(--text); }
.sheet .head { text-align: center; }
.sheet .head .avatar { margin: 0 auto 12px; }
.sheet .head h2 { margin: 0; font-size: 22px; }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 14px 0 18px; }
.badges span { background: var(--chip); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.sheet .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sheet .stat { padding: 12px; }
.sheet .stat b { font-size: 19px; }
.cta { display: block; width: 100%; margin-top: 16px; background: var(--accent); color: #000; font-weight: 700; border-radius: 999px; padding: 12px; }
.cta:hover { filter: brightness(.95); }

/* landing */
.app.landing .rail { display: none; }
.land { flex: 1; overflow-y: auto; display: grid; place-items: center; padding: 32px 16px; }
.land-card { max-width: 520px; width: 100%; text-align: center; }
.land-card h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.01em; }
.drop { display: flex; flex-direction: column; gap: 6px; align-items: center; border: 2px dashed var(--line); border-radius: 20px; padding: 36px 20px;
  margin: 22px 0 12px; cursor: pointer; background: var(--panel); transition: border-color .15s, background .15s; }
.drop:hover, .drop:focus-visible, .drop.over { border-color: var(--text); outline: none; }
.drop.over { background: var(--panel2); }
.land-status { min-height: 20px; font-weight: 600; margin: 0 0 12px; }
.land-status.err { color: var(--me); }
.howto { text-align: left; background: var(--panel); border-radius: 14px; margin-top: 18px; }
.howto summary { padding: 12px 16px; font-weight: 600; cursor: pointer; }
.howto ol { margin: 0; padding: 0 20px 14px 36px; }
.howto li { margin-bottom: 6px; }

@media (max-width: 760px) {
  .app { flex-direction: column-reverse; }
  .rail { width: 100%; flex-direction: row; justify-content: space-around; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); gap: 0; }
  .rail button { width: 42px; height: 42px; }
  .rail .logo, .rail .spacer, .rail .tip, .rail [data-open-other] { display: none; }
  .list { width: 100%; border-right: 0; }
  .app.chat-open .list { display: none; }
  .app:not(.chat-open) .chat-main { display: none; }
  .back { display: grid; }
  .chat-head { padding: 10px 12px; }
  .chat-head .search { display: none; }
  .msgs { padding: 8px 16px 20px; }
  .page { padding: 18px 16px 32px; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .thumb { width: 140px; height: 186px; }
  .lb .stage { max-width: 100%; height: calc(100% - 120px); }
  .lb .nav { top: auto; bottom: 56px; margin: 0; }
  .kv { grid-template-columns: 1fr; }
  .kv > div:nth-child(even) { margin-bottom: 8px; }
  .two { grid-template-columns: 1fr; }
  .mapwrap { flex-direction: column-reverse; }
  .mappanel { width: 100%; border-right: 0; border-top: 1px solid var(--line); height: 45%; }
  #map { flex: 1; }
  .heat { grid-template-columns: 30px repeat(24, 1fr); gap: 1px; }
  .heat div { height: 14px; }
  .sheet-bg.open { align-items: flex-end; padding: 0; }
  .sheet { border-radius: 24px 24px 0 0; max-height: 92%; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail"></nav>
  <div class="body" id="body"></div>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Media viewer">
  <div class="stage" id="lbStage"></div>
  <button class="x" id="lbX" aria-label="Close"></button>
  <button class="nav prev" id="lbPrev" aria-label="Previous"></button>
  <button class="nav next" id="lbNext" aria-label="Next"></button>
  <div class="info" id="lbInfo"></div>
</div>
<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-label="Friend profile"><div class="sheet" id="sheet"></div></div>
<div id="tip" role="tooltip"></div>
<script>
(() => {
let D = null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const avatar = (name, size = 44) => {

  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px;background:hsl(${hue(name)} 55% 48%)">${esc(initials)}</div>`;
};
const nameOf = u => D.names[u] || u;
const fmtN = n => Number(n || 0).toLocaleString();
const pd = s => { if (!s) return null; const d = new Date(String(s).trim().replace(/\//g, '-').replace(' UTC', 'Z').replace(' ', 'T')); return isNaN(d) ? null : d; };
const fmtD = (d, o = { day: 'numeric', month: 'short', year: 'numeric' }) => d ? new Date(d).toLocaleDateString(undefined, o) : '—';
const fmtDT = d => d ? new Date(d).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const dayKey = t => new Date(t).toDateString();
const dayNum = t => Math.floor((t - new Date(t).getTimezoneOffset() * 6e4) / 864e5);
const dayLabel = t => {
  const d = new Date(t), now = new Date(), days = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return d.toLocaleDateString(undefined, { weekday: 'long' });
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
};
const timeOf = t => new Date(t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const ago = t => {
  const s = (Date.now() - t) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm';
  if (s < 86400) return Math.round(s / 3600) + 'h';
  if (s < 604800) return Math.round(s / 86400) + 'd';

};

};

/* ---------- charts ---------- */
const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
const kfmt = v => v >= 1e4 ? Math.round(v / 1e3) + 'k' : v >= 1e3 ? (v / 1e3).toFixed(1).replace('.0', '') + 'k' : String(v);
const legend = series => series.length < 2 ? '' : `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
const dataTable = (cats, series) => `<details class="dt"><summary>View as table</summary><table><tr><th></th>${series.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr>
  ${cats.map((c, i) => `<tr><td>${esc(c)}</td>${series.map(s => `<td>${fmtN(s.values[i])}</td>`).join('')}</tr>`).join('')}</table></details>`;
// Stacked column chart. series[0] sits on the baseline; each segment is separated by a 2px surface gap.
function columns(el, { cats, series, height = 200, tipHead = c => c, every }) {
  el.innerHTML = legend(series) + '<div class="chart"></div>' + dataTable(cats, series);
  const box = $('.chart', el);
  const draw = () => {
    const W = Math.max(260, box.clientWidth), H = height, L = 36, B = 22, T = 8, pw = W - L - 4, ph = H - B - T;
    const totals = cats.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
    const max = niceMax(Math.max(...totals, 1));
    const band = pw / cats.length, bw = Math.max(2, Math.min(band * .72, 34)), step = every || Math.ceil(cats.length / Math.floor(pw / 44));
    let svg = `<svg width="${W}" height="${H}" role="img">`;
    for (const f of [0, .5, 1]) {
      const y = T + ph - ph * f;
      svg += `<line x1="${L}" x2="${W - 4}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${kfmt(max * f)}</text>`;
    }
    cats.forEach((c, i) => {
      const x = L + band * i + (band - bw) / 2;
      let y = T + ph;
      const segs = series.map(s => s.values[i]).map((v, k) => ({ v, k })).filter(s => s.v > 0);
      segs.forEach((s, j) => {
        const h = Math.max(1, ph * s.v / max - (j > 0 ? 2 : 0));
        const top = y - h - (j > 0 ? 2 : 0);
        const r = j === segs.length - 1 ? Math.min(4, bw / 2, h) : 0;
        svg += `<path fill="${series[s.k].color}" d="M${x},${top + h}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${top + h}Z"/>`;
        y = top;
      });
      if (i % step === 0) svg += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(c)}</text>`;
      svg += `<rect class="hit" data-i="${i}" tabindex="0" x="${L + band * i}" y="${T}" width="${band}" height="${ph}" aria-label="${esc(c)}: ${series.map(s => s.name + ' ' + s.values[i]).join(', ')}"/>`;
    });
    box.innerHTML = svg + '</svg>';
  };
  draw();
  const show = e => { const i = e.target.dataset?.i; if (i == null) return;
    showTip(e, tipHead(cats[i]), series.map(s => [s.color, fmtN(s.values[i]), s.name])); };
  box.addEventListener('pointermove', show); box.addEventListener('focusin', show);
  box.addEventListener('pointerleave', hideTip); box.addEventListener('focusout', hideTip);
  new ResizeObserver(() => draw()).observe(box);
}
const hbars = (rows, { fmt = fmtN, onClick } = {}) => {

/* ---------- friend profile sheet ---------- */
const stats = c => {
  if (c._s) return c._s;
  let sent = 0, recv = 0, media = 0, snaps = 0;
  const days = new Map(), years = {};
  for (const m of c.msgs) {
    const mine = m.f === D.me;
    if (m.k.startsWith('SNAP_')) snaps++;
    else { mine ? sent++ : recv++; if (m.m.length || m.x) media++; }
    const dn = dayNum(m.t);
    days.set(dn, (days.get(dn) || 0) | (mine ? 1 : 2));
    const y = new Date(m.t).getFullYear();
    (years[y] ??= [0, 0])[mine ? 0 : 1]++;
  }
  // a streak day is one where both sides sent something, like Snapchat's own streaks
  const both = [...days].filter(([, v]) => v === 3).map(([k]) => k).sort((a, b) => a - b);
  let streak = 0, run = 0, prev = null;
  for (const k of both) { run = prev !== null && k === prev + 1 ? run + 1 : 1; streak = Math.max(streak, run); prev = k; }
  return c._s = { sent, recv, media, snaps, activeDays: days.size, streak, years, first: c.msgs[0]?.t, last: c.msgs.at(-1)?.t };
};

    ${c.group ? `<h2 style="font-size:15px;margin:18px 0 8px">Members</h2><div class="chips">${c.members.map(u => `<span class="chip">${esc(u === D.me ? 'You' : nameOf(u))}</span>`).join('')}</div>` : ''}

const SNAP_COLOR = k => k === 'SNAP_VIDEO' ? 'var(--video)' : 'var(--me)';
const convStatus = c => {
  const m = c.msgs[c.msgs.length - 1];
  if (!m) return '';
  const mine = m.f === D.me;
  let icon, text;
  if (m.k.startsWith('SNAP_')) {
    icon = `<span class="sq${mine ? ' hollow' : ''}" style="background:${SNAP_COLOR(m.k)};border-color:${SNAP_COLOR(m.k)}"></span>`;
    text = mine ? 'Delivered' : 'Received';
  } else {
    icon = `<span class="sq${mine ? ' hollow' : ''}" style="background:var(--them);border-color:var(--them);border-radius:3px 3px 3px 0"></span>`;
    const who = c.group && !mine ? nameOf(m.f) + ': ' : mine ? 'You: ' : '';
    text = m.c ? who + m.c : m.k === 'MEDIA' ? (mine ? 'Sent a Chat' : 'Received a Chat') : mine ? 'Sent' : 'Received';
  }
  const st = stats(c);
  const fire = st.streak >= 3 && Date.now() - c.last < 2 * 864e5 ? ' 🔥' : '';
  return `${icon}<span class="preview">${esc(text)}</span><span>· ${ago(m.t)}${fire}</span>`;
};

const PAGE = 400;
function openChat(id) {
  const c = D.conversations.find(x => x.id === id); if (!c) return;
  current = id;
  document.querySelectorAll('.conv').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  $('#app').classList.add('chat-open');
  const others = c.members.filter(u => u !== D.me);
  const palette = ['var(--them)', '#9b59ff', '#20b26b', '#ff8a00', '#e84393', '#00b3a4', '#c0a000'];
  const colorOf = u => u === D.me ? 'var(--me)' : c.group ? palette[others.indexOf(u) % palette.length] : 'var(--them)';
  const first = c.msgs[0], sub = c.group ? `${others.length + 1} members` : '@' + c.user;
  $('#chatMain').innerHTML = `
    <header class="chat-head"><button class="back" id="back" aria-label="Back">${I.back}</button>
      <button class="who-btn" id="whoBtn" title="View profile">${avatar(c.name, 40)}
      <div class="title"><b>${esc(c.name)}</b><span>${esc(sub)} · ${fmtN(c.msgs.length)} messages${first ? ' since ' + new Date(first.t).toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : ''}</span></div></button>
      <label class="search">${I.search}<input id="mq" placeholder="Search in chat"></label></header>
    <div class="msgs" id="msgs"><div class="msgs-inner" id="msgsInner"></div></div>`;
  $('#back').onclick = () => $('#app').classList.remove('chat-open');
  $('#whoBtn').onclick = () => openFriend(c.id);

  let q = '', list = c.msgs, shown = 0;
  const mediaItems = [];
  const body = (m, qre) => {
    const mine = m.f === D.me;
    if (m.k.startsWith('SNAP_')) {
      const col = SNAP_COLOR(m.k);
      return `<span class="pill"><span class="sq${mine ? ' hollow' : ''}" style="background:${col};border-color:${col}"></span>${mine ? 'Sent' : 'Received'} a ${m.k === 'SNAP_VIDEO' ? 'video' : 'photo'} Snap</span>`;
    }
    if (m.k === 'STATUSERASEDMESSAGE') return '<span class="pill italic">Message deleted</span>';
    let html = '';
    if (m.m.length) {
      // "b~G…" files are the caption/drawing layer of the other media in the same message
      const isOv = f => /^[\d-]+_b~G/.test(f);
      const mains = m.m.filter(f => !isOv(f));
      const ovs = mains.length ? m.m.filter(isOv) : [];
      html += '<div class="media-row">' + (mains.length ? mains : m.m).map((f, n) => {
        const src = fileUrl('chat_media', f);
        if (isAud(f) || (m.k === 'NOTE' && !isImg(f))) return `<audio controls preload="none" src="${src}"></audio>`;
        if (!isVid(f) && !isImg(f)) return '';
        const ov = ovs[n] ? fileUrl('chat_media', ovs[n]) : null;
        const i = mediaItems.push({ src, ov, label: `${nameOf(m.f)} · ${new Date(m.t).toLocaleString()}` }) - 1;
        return `<div class="thumb" data-i="${i}">${isVid(f)
          ? `<video muted playsinline preload="metadata" data-src="${src}"></video><div class="play"><span>${I.play}</span></div>`
          : `<img loading="lazy" data-src="${src}" alt="">`}${ov ? `<img class="ov" data-src="${ov}" alt="">` : ''}</div>`;
      }).join('') + '</div>';
    } else if (m.x || (m.k === 'MEDIA' && !m.c)) {
      html += `<span class="pill italic">${m.k === 'NOTE' ? 'Voice note' : 'Photo or video'} not included in export</span>`;
    } else if (m.k === 'STICKER') html += '<span class="pill italic">Sticker</span>';
    else if (m.k === 'SHARE') html += '<span class="pill italic">Shared a story or link</span>';
    else if (!m.c) html += `<span class="pill italic">${m.s ? 'Empty message' : 'Chat not saved'}</span>`;
    if (m.c) {
      let t = linkify(m.c);
      if (qre) t = t.replace(qre, '<mark>$1</mark>');
      html += m.m.length ? `<div class="cap">${t}</div>` : t;
    }
    return html;
  };
  const render = (msgs, qre) => {
    let out = '', lastDay = null, lastFrom = null;
    for (const m of msgs) {
      const d = dayKey(m.t);
      if (d !== lastDay) { out += (lastFrom !== null ? '</div>' : '') + `<div class="day">${dayLabel(m.t)}</div>`; lastDay = d; lastFrom = null; }
      if (m.f !== lastFrom) {
        const col = colorOf(m.f);
        out += (lastFrom !== null ? '</div>' : '') + `<div class="grp"><div class="who" style="color:${col}">${m.f === D.me ? 'Me' : esc(nameOf(m.f))}</div>`;
        lastFrom = m.f;
      }
      out += `<div class="line" style="border-color:${colorOf(m.f)}">${body(m, qre)}<time>${timeOf(m.t)}</time></div>`;
    }
    return out + (lastFrom !== null ? '</div>' : '');
  };
  const inner = $('#msgsInner'), box = $('#msgs');
  const draw = (keepBottom) => {
    mediaItems.length = 0;
    const start = Math.max(0, list.length - shown);
    const qre = q ? new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi') : null;
    const prevH = box.scrollHeight, prevTop = box.scrollTop;
    inner.innerHTML = (start > 0 ? `<button class="more" id="more">Load earlier messages (${fmtN(start)} more)</button>` : '')
      + (list.length ? render(list.slice(start), qre) : `<div class="empty" style="padding:60px 0">${q ? 'No messages match' : 'No messages'}</div>`);
    lazy(inner);
    if (keepBottom) box.scrollTop = box.scrollHeight;
    else box.scrollTop = box.scrollHeight - prevH + prevTop;
    const more = $('#more'); if (more) more.onclick = () => { shown += PAGE; draw(false); };
  };
  shown = PAGE; draw(true);
  box.addEventListener('scroll', () => { if (box.scrollTop < 40 && shown < list.length) { shown += PAGE; draw(false); } });
  inner.onclick = e => { const t = e.target.closest('.thumb'); if (t) openLb(mediaItems, +t.dataset.i); };
  let timer;
  $('#mq').oninput = e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      q = e.target.value.trim();
      const ql = q.toLowerCase();
      list = q ? c.msgs.filter(m => m.c.toLowerCase().includes(ql)) : c.msgs;
      shown = PAGE; draw(true);
    }, 150);
  };
}

  });

/* ---------- memories ---------- */
let memFilter = 'all', memYear = '';
function drawMemories() {
  const years = [...new Set(D.memories.map(m => m.d.slice(0, 4)))];
  const vids = D.memories.filter(m => isVid(m.main)).length;
  const now = new Date(), md = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const otd = D.memories.filter(m => m.d.slice(5) === md && +m.d.slice(0, 4) < now.getFullYear()).map(memItem);
  $('#body').innerHTML = `<section class="page" id="page"><div class="page-inner">
    <h1>Memories</h1><p class="sub">${fmtN(D.memories.length)} saved · ${fmtN(D.memories.length - vids)} photos · ${fmtN(vids)} videos · since ${years[years.length - 1] || '—'}</p>
    ${otd.length ? `<div class="month" style="margin-top:6px">On this day</div><div class="otd" id="otd">${otd.map((m, i) => memTile(m, i, `${now.getFullYear() - +m.d.slice(0, 4)}y ago`)).join('')}</div>` : ''}
    <div class="chips" id="memChips" style="margin-top:14px">
      ${[['all', 'All'], ['img', 'Photos'], ['vid', 'Videos']].map(([k, l]) => `<button data-f="${k}" class="${memFilter === k ? 'on' : ''}">${l}</button>`).join('')}
      <select id="memYear" aria-label="Year"><option value="">All years</option>${years.map(y => `<option${y === memYear ? ' selected' : ''}>${y}</option>`).join('')}</select>
    </div>
    <div id="memGrid"></div><div id="memSentinel" style="height:1px"></div></div></section>`;
  if (otd.length) { lazy($('#otd')); $('#otd').onclick = e => { const t = e.target.closest('.tile'); if (t) openLb(otd, +t.dataset.i); }; }
  $('#memChips').onclick = e => { const b = e.target.closest('button'); if (b) { memFilter = b.dataset.f; drawMemories(); } };
  $('#memYear').onchange = e => { memYear = e.target.value; drawMemories(); };

  const items = D.memories.filter(m => (memFilter === 'all' || (memFilter === 'vid') === isVid(m.main)) && (!memYear || m.d.startsWith(memYear))).map(memItem);
  const grid = $('#memGrid');
  if (!items.length) { grid.innerHTML = '<div class="empty" style="padding:60px 0">No memories here</div>'; return; }
  let done = 0, lastMonth = null, cur = null;
  const batch = () => {
    const end = Math.min(items.length, done + 180);
    for (; done < end; done++) {
      const m = items[done], mo = m.d.slice(0, 7);
      if (mo !== lastMonth) {
        lastMonth = mo;
        const h = document.createElement('div'); h.className = 'month';
        h.textContent = new Date(mo + '-15').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        cur = document.createElement('div'); cur.className = 'grid';
        grid.append(h, cur);
      }
      cur.insertAdjacentHTML('beforeend', memTile(m, done));
    }
    lazy(grid);
  };
  batch();
  const so = new IntersectionObserver(es => { if (es[0].isIntersecting && done < items.length) batch(); }, { root: $('#page'), rootMargin: '1200px' });
  so.observe($('#memSentinel'));
  grid.onclick = e => { const t = e.target.closest('.tile'); if (t) openLb(items, +t.dataset.i); };
  grid.onmouseover = e => { const v = e.target.closest('.tile')?.querySelector('video[src]'); if (v) v.play().catch(() => {}); };
  grid.onmouseout = e => { const v = e.target.closest('.tile')?.querySelector('video'); if (v && !e.relatedTarget?.closest?.('.tile')) { v.pause(); } };
}

/* ---------- loading an export ---------- */
// Turns the export's files ([{ path, file }]) into the shape every view reads. Nothing leaves the browser.
async function buildData(entries) {
  const json = {};
  FILES.chat_media.clear(); FILES.memories.clear();
  for (const { path, file } of entries) {
    const parts = path.split('/').filter(Boolean), name = parts.at(-1), dir = parts.at(-2);
    if (!name || name.startsWith('.')) continue;
    if (dir === 'chat_media' || dir === 'memories') FILES[dir].set(name, file);
    else if (name.endsWith('.json') && (dir === 'json' || !json[name])) json[name] = file;
  }
  if (!json['chat_history.json'] && !json['memories_history.json'] && !json['account.json']) throw new Error('nojson');
  const J = async n => { try { return json[n] ? JSON.parse(await json[n].text()) : {}; } catch { return {}; } };
  const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};

  // chat_media files are named DATE_<MediaID>.ext
  const chatMedia = new Map();
  for (const f of FILES.chat_media.keys()) {
    const i = f.indexOf('_'); if (i < 0) continue;
    const id = f.slice(i + 1).replace(/\.[^.]+$/, '');
    if (!chatMedia.has(id)) chatMedia.set(id, []);
    chatMedia.get(id).push(f);
  }
  const account = obj(await J('account.json')), friends = obj(await J('friends.json'));
  const chats = obj(await J('chat_history.json')), snaps = obj(await J('snap_history.json'));
  let me = account['Basic Information']?.Username || '';
  if (!me) for (const list of Object.values(chats)) { const m = Array.isArray(list) && list.find(m => m?.IsSender); if (m) { me = m.From; break; } }
  const names = {};
  for (const g of Object.values(friends)) if (Array.isArray(g)) for (const f of g) if (f?.Username) names[f.Username] = f['Display Name'] || f.Username;
  if (me) names[me] = account['Basic Information']?.Name || me;
  const ts = m => m['Created(microseconds)'] ?? pd(m.Created)?.getTime() ?? 0;

  const conversations = [];
  for (const key of new Set([...Object.keys(chats), ...Object.keys(snaps)])) {
    const msgs = []; let title = null;
    for (const m of Array.isArray(chats[key]) ? chats[key] : []) {
      if (!m || typeof m !== 'object') continue;
      title ||= m['Conversation Title'];
      const files = [];
      for (const id of String(m['Media IDs'] || '').split('|').map(x => x.trim()).filter(Boolean)) files.push(...(chatMedia.get(id) || []));
      msgs.push({ t: ts(m), f: m.From || '', k: m['Media Type'] || 'TEXT', c: m.Content || '', m: files, x: m['Media IDs'] ? 1 : 0, s: m.IsSaved ? 1 : 0 });
    }
    for (const m of Array.isArray(snaps[key]) ? snaps[key] : []) {
      if (m && typeof m === 'object') msgs.push({ t: ts(m), f: m.From || '', k: 'SNAP_' + (m['Media Type'] || 'IMAGE'), c: '', m: [], x: 0, s: 0 });
    }
    if (!msgs.length) continue;
    msgs.sort((a, b) => a.t - b.t);
    conversations.push({ id: key, group: !!title, name: title ? title.trim() : names[key] || key, user: title ? null : key,
      members: [...new Set(msgs.map(m => m.f))].sort(), last: msgs.at(-1).t, msgs });
  }
  conversations.sort((a, b) => b.last - a.last);

  // memories: DATE_UUID-main.ext (+ optional DATE_UUID-overlay.png)
  const mem = {};
  for (const f of FILES.memories.keys()) {
    const m = /^(\d{4}-\d{2}-\d{2})_(.+)-(main|overlay)\.(\w+)$/.exec(f); if (!m) continue;
    (mem[m[2]] ??= { d: m[1] })[m[3]] = f;
  }
  const memories = Object.values(mem).filter(v => v.main).sort((a, b) => b.d < a.d ? -1 : b.d > a.d ? 1 : 0);

  // where memories were taken; files carry no id, so the map links points to files by day
  const memPlaces = [];
  for (const m of obj(await J('memories_history.json'))['Saved Media'] || []) {
    const c = /(-?\d+\.?\d*),\s*(-?\d+\.?\d*)/.exec(m?.Location || ''), t = pd(m?.Date);
    if (c && t && !(+c[1] === 0 && +c[2] === 0)) memPlaces.push([t.getTime(), String(m['Media Type'] || '').slice(0, 1), +c[1], +c[2]]);
  }

  return {
    me, names, conversations, memories, memPlaces, friends, account,
    profile: obj(await J('user_profile.json')),
    accountHistory: obj(await J('account_history.json')),
    location: obj(await J('location_history.json')),
    places: obj(await J('snap_map_places_history.json'))['Snap Map Places History'] || [],
    stories: obj(await J('story_history.json')),
    calls: obj(await J('talk_history.json')),
    ranking: obj(await J('ranking.json')),
    bitmoji: obj(await J('bitmoji.json')),
    connectedApps: obj(await J('connected_apps.json')),
    stickers: obj(await J('custom_sticker.json'))['My Custom Stickers'] || [],
    terms: obj(await J('terms_history.json')),
    searches: obj(await J('search_history.json')),
  };
}

async function readEntry(entry, out) {
  if (entry.isFile) { out.push({ path: entry.fullPath, file: await new Promise((res, rej) => entry.file(res, rej)) }); return; }
  if (entry.name === 'html') return; // Snapchat's own HTML pages aren't needed
  const reader = entry.createReader();
  for (;;) {
    const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    if (!batch.length) break;
    await Promise.all(batch.map(e => readEntry(e, out)));
  }
}

async function load(getEntries) {
  if (!$('#landStatus')) drawLanding();
  const status = $('#landStatus');
  status.textContent = 'Reading your export…'; status.className = 'land-status';
  try {
    const entries = await getEntries();
    if (entries.some(e => /\.zip$/i.test(e.path)) && !entries.some(e => /\.json$/i.test(e.path))) throw new Error('zip');
    status.textContent = `Reading ${fmtN(entries.length)} files…`;
    D = await buildData(entries);
    storyViews = D.stories['Friend and Public Story Views'] || [];
    $('#app').classList.remove('landing');
    go('chats');
  } catch (e) {
    status.className = 'land-status err';
    status.textContent = e.message === 'zip' ? 'That looks like a .zip file. Unzip it first, then open the folder.'
      : e.message === 'nojson' ? "Couldn't find Snapchat's JSON files in that folder. When requesting your data, tick “Export JSON files”, then open the unzipped folder."
      : 'Something went wrong reading that folder: ' + e.message;
  }
}

function drawLanding() {
  $('#app').classList.add('landing');
  $('#body').innerHTML = `<section class="land"><div class="land-card">
    <div class="logo" style="width:56px;height:56px;border-radius:16px;margin:0 auto 18px">${I.ghost}</div>
    <h1>View your Snapchat data</h1>
    <p class="sub">Chats with their photos and videos, memories, a map, stories and a recap, laid out like the app.</p>
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="pick" webkitdirectory directory multiple hidden>
      <b>Drop your unzipped export folder here</b><span class="muted">or click to choose it. Downloaded in parts? Drop all the folders at once.</span>
    </label>
    <p class="land-status" id="landStatus" role="status"></p>
    <p class="muted">🔒 Everything happens in your browser. Nothing is uploaded, and your data isn't stored after you close the page.</p>
    <details class="howto"><summary>How do I get my data?</summary><ol>
      <li>In Snapchat, open <b>Settings → My Data</b> (or visit accounts.snapchat.com and choose My Data).</li>
      <li>Tick <b>Export your Memories</b>, <b>Export JSON files</b> and the categories you want, then pick a date range.</li>
      <li>Submit. Snapchat emails you when the download is ready. It can be several files for big accounts.</li>
      <li>Unzip everything, then drop the folder (or folders) here.</li></ol></details>
  </div></section>`;
  const drop = $('#drop');
  $('#pick').onchange = e => { const fl = [...e.target.files]; load(async () => fl.filter(f => !/\/html\//.test(f.webkitRelativePath)).map(f => ({ path: f.webkitRelativePath || f.name, file: f }))); };
  drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#pick').click(); } };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => {
    e.preventDefault(); drop.classList.remove('over');
    const items = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
    load(async () => { const out = []; for (const it of items) await readEntry(it, out); return out; });
  };
}
// Hook for tests and tooling: SnapViewer.load([{ path, file }])
window.SnapViewer = { load: entries => load(async () => entries) };

drawRail();
drawLanding();
})();
</script>
